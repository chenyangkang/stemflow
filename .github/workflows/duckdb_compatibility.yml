name: duckdb-compatibility

on:
  workflow_dispatch:
  push:
    branches: [main, codex-rewrite]
    paths:
      - 'stemflow/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'setup.py'
      - '.github/workflows/duckdb_compatibility.yml'
  pull_request:
    paths:
      - 'stemflow/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'setup.py'
      - '.github/workflows/duckdb_compatibility.yml'

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        python: ['3.11', '3.13']
        duckdb: ['>=1.1.3,<1.2', '>=1.5,<2', '>=2,<3']
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install supported DuckDB version and optional estimators
        run: python -m pip install -e ".[monitoring,tuning]" pytest "duckdb${{ matrix.duckdb }}"
      - name: Check execution, calibration and relation compatibility
        run: >-
          python -m pytest -q --disable-warnings
          tests/test_duckdb_compatibility.py
          tests/test_execution_rewrite.py
          tests/test_shared_prediction.py
          tests/test_prediction_streaming.py
          tests/test_data_preparation.py
          tests/test_calibration.py
          tests/test_gridding_rotation.py
          tests/test_execution_monitor.py
          tests/test_execution_profile.py
          tests/test_tuning_verbosity.py
          tests/test_benchmark_memory.py
          tests/test_prediction_stress_prototypes.py
          --junitxml=duckdb_compatibility.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duckdb-${{ strategy.job-index }}-python${{ matrix.python }}
          path: duckdb_compatibility.xml
