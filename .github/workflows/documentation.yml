name: documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'stemflow/**'
      - 'scripts/01_documentation/**'
      - 'mkdocs.yml'
      - 'setup.py'
      - 'requirements.txt'
      - '.github/workflows/documentation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-execute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install documentation and example dependencies
        run: >-
          python -m pip install -e ".[monitoring,tuning]"
          mkdocs-material pillow cairosvg mkdocs-jupyter 'mkdocstrings[python]'
          nbformat nbclient ipykernel matplotlib-inline
      - name: Execute the self-contained 2.0.0 notebooks
        run: |
          python scripts/01_documentation/execute_notebook.py docs/Examples/10.Execution_and_memory.ipynb --output docs/Examples/10.Execution_and_memory.ipynb --in-process
          python scripts/01_documentation/execute_notebook.py docs/Examples/11.Local_calibration_and_profiling.ipynb --output docs/Examples/11.Local_calibration_and_profiling.ipynb --in-process
      - name: Build documentation without downloading social-card fonts
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          config = yaml.safe_load(Path("mkdocs.yml").read_text())
          config["plugins"] = [
              {"social": {"enabled": False}} if plugin == "social" else plugin
              for plugin in config["plugins"]
          ]
          Path("mkdocs.preview.yml").write_text(yaml.safe_dump(config, sort_keys=False))
          PY
          python -m mkdocs build -f mkdocs.preview.yml
