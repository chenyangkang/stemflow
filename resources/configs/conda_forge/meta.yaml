{% set name = "stemflow" %}
{% set version = "@VERSION@" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: @SOURCE_URL@
  sha256: @SHA256@

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=68.2.0
    - wheel
  run:
    - python >={{ python_min }}
    - joblib >=1.4.2
    - matplotlib-base >=3.7.1
    - numpy >=1.24.3
    - pandas >=2.2.0
    - plotly >=5.9.0
    - scikit-learn >=1.2.2
    - scipy >=1.10.1
    - setuptools >=68.2.0
    - tqdm >=4.65.0
    - duckdb >=1.1.3,<3
    - pyarrow >=17.0.0
    - cartopy >=0.22

test:
  imports:
    - stemflow
    - stemflow.calibration
    - stemflow.tuning
    - stemflow.lazyloading.data_preparation
    - stemflow.utils.execution_monitor
    - stemflow.model.AdaSTEM
  requires:
    - pip
    - python {{ python_min }}
  commands:
    - pip check
    - python -c "import stemflow; assert stemflow.__version__ == '{{ version }}'"

about:
  home: https://github.com/chenyangkang/stemflow
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "A package for Adaptive Spatio-Temporal Exploratory Model (AdaSTEM) in Python"
  doc_url: https://chenyangkang.github.io/stemflow/
  dev_url: https://github.com/chenyangkang/stemflow
  description: |
    stemflow fits and aggregates local spatiotemporal models, with optional
    memory-mapped execution, calibration, tuning and execution monitoring.

extra:
  recipe-maintainers:
    - chenyangkang
